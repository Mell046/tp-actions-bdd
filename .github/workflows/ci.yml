name: Python CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer la base de donnees
        run: bash db/setup.sh

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dependances
        run: pip install -r requirements.txt
        working-directory: python-app

      - name: Executer les tests
        run: pytest -v
        working-directory: python-app

  node:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer la base de donnees
        run: bash db/setup.sh

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances
        run: npm ci
        working-directory: node-app

      - name: Executer les tests
        run: npm test
        working-directory: node-app

  java:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer la base de donnees
        run: bash db/setup.sh

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler et tester
        run: mvn -B package
        working-directory: java-app

  php:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer la base de donnees
        run: bash db/setup.sh

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql

      - name: Installer les dependances
        run: composer install --no-interaction
        working-directory: php-app

      - name: Executer les tests
        run: vendor/bin/phpunit tests
        working-directory: php-app

  build:
    needs: [python, node, java, php]
    runs-on: ubuntu-latest
    steps:
      - name: Message de build
        run: echo "Les 4 jobs de tests ont reussi, build termine"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploiement
        run: echo "Déploiement en cours"

      - name: Verifier le secret
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: test -n "$TOKEN" && echo "Token présent"